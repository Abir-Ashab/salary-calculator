<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeTracker Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="fas fa-clock"></i>
            </div>
            <div class="loading-text">SalaryTracker Pro</div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="logo-text">
                        <h1>SalaryTracker Pro</h1>
                        <p>Professional Time & Salary Management</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" title="Toggle Dark Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="export-btn" id="exportBtn" title="Export Data">
                        <i class="fas fa-download"></i>
                        <span>Export</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Quick Stats Dashboard -->
            <section class="dashboard-stats">
                <div class="stat-card stat-today">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-day"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Today's Hours</h3>
                        <div class="stat-value" id="todayHours">0h 0m</div>
                    </div>
                </div>
                <div class="stat-card stat-month">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-alt"></i>
                    </div>
                    <div class="stat-info">
                        <h3>This Month</h3>
                        <div class="stat-value" id="thisMonthHours">0h 0m</div>
                    </div>
                </div>
                <div class="stat-card stat-earnings">
                    <div class="stat-icon">
                        <i class="fas fa-rupee-sign"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Monthly Earnings</h3>
                        <div class="stat-value" id="monthlyEarnings">0</div>
                    </div>
                </div>
                <div class="stat-card stat-rate">
                    <div class="stat-icon">
                        <i class="fas fa-coins"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Hourly Rate</h3>
                        <div class="stat-value" id="displayRate">300 (BDT)</div>
                    </div>
                </div>
            </section>

            <!-- Input Section -->
            <section class="input-section">
                <div class="section-header">
                    <h2><i class="fas fa-plus-circle"></i> Add Time Entry</h2>
                    <div class="section-actions">
                        <button class="quick-add-btn" onclick="quickAdd('today')" title="Add for today">
                            <i class="fas fa-calendar-day"></i>
                            Today
                        </button>
                        <button class="quick-add-btn" onclick="nextDate()" title="Go to next date">
                            <i class="fas fa-arrow-right"></i>
                            Next Date
                        </button>
                    </div>
                </div>

                <div class="input-card">
                    <!-- Hourly Rate Setting -->
                    <div class="rate-setting">
                        <div class="form-group">
                            <label for="hourlyRate">
                                <i class="fas fa-coins"></i>
                                Hourly Rate
                            </label>
                            <div class="input-with-action">
                                <input type="number" id="hourlyRate" placeholder="300" value="300" min="1" step="0.01">
                                <button class="btn btn-secondary" onclick="updateHourlyRate()">
                                    <i class="fas fa-check"></i>
                                    Update
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Time Entry Form -->
                    <div class="entry-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="dateInput">
                                    <i class="fas fa-calendar"></i>
                                    Date
                                </label>
                                <input type="date" id="dateInput" class="form-input">
                            </div>
                            <div class="form-group">
                                <label for="timeInput">
                                    <i class="fas fa-clock"></i>
                                    Time Entry
                                </label>
                                <input type="text" id="timeInput" class="form-input" placeholder="8h20m, 7h2m">
                               
                            </div>
                            <div class="form-group">
                                <button class="btn btn-primary btn-add" onclick="addTimeEntry()">
                                    <i class="fas fa-plus"></i>
                                    <span>Add Entry</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Time Entries List -->
            <section class="entries-section">
                <div class="section-header">
                    <h2><i class="fas fa-list"></i> Recent Entries</h2>
                    <div class="section-actions">
                        <select id="filterMonth" class="filter-select" onchange="filterEntries()">
                            <option value="all">All Time</option>
                        </select>
                        <button class="clear-btn" onclick="clearAllEntries()" title="Clear All">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>

                <div class="entries-container" id="timeEntries">
                    <div class="empty-state">
                        <i class="fas fa-clock"></i>
                        <h3>No time entries yet</h3>
                        <p>Add your first entry above to start tracking!</p>
                    </div>
                </div>
            </section>

            <!-- Monthly Breakdown -->
            <section class="monthly-section" id="monthlySection" style="display: none;">
                <div class="section-header">
                    <h2><i class="fas fa-chart-bar"></i> Monthly Breakdown</h2>
                    <div class="section-actions">
                        <button class="toggle-view-btn" id="toggleViewBtn" onclick="toggleMonthlyView()">
                            <i class="fas fa-th-large"></i>
                            Grid View
                        </button>
                    </div>
                </div>
                <div class="monthly-container" id="monthlyData"></div>
            </section>
        </main>

        <!-- Toast Notifications -->
        <div class="toast-container" id="toastContainer"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
</body>
</html>
