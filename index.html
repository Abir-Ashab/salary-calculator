<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional time tracking and salary management application">
    <title>SalaryTracker Pro - Time & Salary Management</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen" aria-label="Loading application">
        <div class="loading-content">
            <div class="loading-logo">
                <i class="fas fa-clock" aria-hidden="true"></i>
            </div>
            <div class="loading-text">SalaryTracker Pro</div>
            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="app-container" id="appContainer">
        <!-- Header -->
        <header class="app-header" role="banner">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <i class="fas fa-clock" aria-hidden="true"></i>
                    </div>
                    <div class="logo-text">
                        <h1>SalaryTracker Pro</h1>
                        <p>Professional Time & Salary Management</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" title="Toggle Dark Mode">
                        <i class="fas fa-moon" aria-hidden="true"></i>
                    </button>
                    <button class="export-btn" id="exportBtn" aria-label="Export data" title="Export Data">
                        <i class="fas fa-download" aria-hidden="true"></i>
                        <span>Export</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content" role="main">
            <!-- Quick Stats Dashboard -->
            <section class="dashboard-stats" aria-label="Dashboard statistics">
                <div class="stat-card stat-today">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-day" aria-hidden="true"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Today's Hours</h3>
                        <div class="stat-value" id="todayHours">0h 0m</div>
                    </div>
                </div>
                <div class="stat-card stat-month">
                    <div class="stat-icon">
                        <i class="fas fa-calendar-alt" aria-hidden="true"></i>
                    </div>
                    <div class="stat-info">
                        <h3>This Month</h3>
                        <div class="stat-value" id="thisMonthHours">0h 0m</div>
                    </div>
                </div>
                <div class="stat-card stat-earnings">
                    <div class="stat-icon">
                        <i class="fas fa-rupee-sign" aria-hidden="true"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Monthly Earnings</h3>
                        <div class="stat-value" id="monthlyEarnings">0</div>
                    </div>
                </div>
                <div class="stat-card stat-rate">
                    <div class="stat-icon">
                        <i class="fas fa-coins" aria-hidden="true"></i>
                    </div>
                    <div class="stat-info">
                        <h3>Hourly Rate</h3>
                        <div class="stat-value" id="displayRate">300 (BDT)</div>
                    </div>
                </div>
            </section>

            <!-- Input Section -->
            <section class="input-section" aria-label="Add time entry">
                <div class="section-header">
                    <h2><i class="fas fa-plus-circle" aria-hidden="true"></i> Add Time Entry</h2>
                    <div class="section-actions">
                        <button class="quick-add-btn" id="quickAddBtn" title="Add for today" aria-label="Add entry for today">
                            <i class="fas fa-calendar-day" aria-hidden="true"></i>
                            Today
                        </button>
                        <button class="quick-add-btn" onclick="nextDate()" title="Go to next date">
                            <i class="fas fa-arrow-right"></i>
                            Next Date
                        </button>
                    </div>
                </div>

                <div class="input-card">
                    <!-- Hourly Rate Setting -->
                    <div class="rate-setting">
                        <div class="form-group">
                            <label for="hourlyRate">
                                <i class="fas fa-coins" aria-hidden="true"></i>
                                Hourly Rate
                            </label>
                            <div class="input-with-action">
                                <input type="number" id="hourlyRate" placeholder="300" value="300" min="1" step="0.01" aria-label="Hourly rate in BDT">
                                <button class="btn btn-secondary" id="updateRateBtn" aria-label="Update hourly rate">
                                    <i class="fas fa-check" aria-hidden="true"></i>
                                    Update
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Time Entry Form -->
                    <form class="entry-form" id="timeEntryForm" aria-label="Time entry form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="dateInput">
                                    <i class="fas fa-calendar" aria-hidden="true"></i>
                                    Date
                                </label>
                                <input type="date" id="dateInput" class="form-input" aria-label="Entry date" required>
                            </div>
                            <div class="form-group">
                                <label for="timeInput">
                                    <i class="fas fa-clock" aria-hidden="true"></i>
                                    Time Entry
                                </label>
                                <input type="text" id="timeInput" class="form-input" placeholder="8h20m, 7h2m" aria-label="Hours and minutes" required>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn btn-primary btn-add" aria-label="Add time entry">
                                    <i class="fas fa-plus" aria-hidden="true"></i>
                                    <span>Add Entry</span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Time Entries List -->
            <section class="entries-section" aria-label="Recent entries">
                <div class="section-header">
                    <h2><i class="fas fa-list" aria-hidden="true"></i> Recent Entries</h2>
                    <div class="section-actions">
                        <select id="filterMonth" class="filter-select" aria-label="Filter entries by month">
                            <option value="all">All Time</option>
                        </select>
                        <button class="clear-btn" id="clearAllBtn" title="Clear All" aria-label="Delete all entries">
                            <i class="fas fa-trash" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <div class="entries-container" id="timeEntries" role="list">
                    <div class="empty-state">
                        <i class="fas fa-clock" aria-hidden="true"></i>
                        <h3>No time entries yet</h3>
                        <p>Add your first entry above to start tracking!</p>
                    </div>
                </div>
            </section>

            <!-- Monthly Breakdown -->
            <section class="monthly-section" id="monthlySection" aria-label="Monthly breakdown" hidden>
                <div class="section-header">
                    <h2><i class="fas fa-chart-bar" aria-hidden="true"></i> Monthly Breakdown</h2>
                    <div class="section-actions">
                        <button class="toggle-view-btn" id="toggleViewBtn" aria-label="Toggle monthly view">
                            <i class="fas fa-th-large" aria-hidden="true"></i>
                            Grid View
                        </button>
                    </div>
                </div>
                <div class="monthly-container" id="monthlyData"></div>
            </section>
        </main>

        <!-- Toast Notifications -->
        <div class="toast-container" id="toastContainer" role="region" aria-label="Notifications" aria-live="polite"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
</body>
</html>
